[project]
name = "abi-research-problem"
version = "0.1.0"
description = "GOES ABI Contrail Segmentation research problem provider for ml-autoresearch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ml-autoresearch",
    "httpx>=0.28.1",
    "matplotlib>=3.11.0",
    "netcdf4>=1.7.4",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
    "pyproj>=3.7.2",
    "pyresample>=1.35.0",
    "s3fs>=2026.6.0",
    "satpy>=0.60.0",
    "scipy>=1.18.0",
    "xarray>=2026.7.0",
    "zarr>=3.2.1",
]

[project.entry-points."ml_autoresearch.research_problems"]
goes_abi_contrail_segmentation = "abi_contrail.research_problem:build_spec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "/.pi-subagents",
    "/notebooks",
    "/planning-inputs",
]

[tool.hatch.build.targets.wheel]
packages = ["abi_contrail"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
torch = [
    "torch>=2.13.0",
]
baselines = [
    "segmentation-models-pytorch>=0.5.0",
    "torch>=2.13.0",
]

[tool.uv.sources]
ml-autoresearch = { path = "../ml-autoresearch", editable = true }

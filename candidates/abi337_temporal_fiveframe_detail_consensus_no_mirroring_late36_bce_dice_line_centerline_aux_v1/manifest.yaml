name: abi337_temporal_fiveframe_detail_consensus_no_mirroring_late36_bce_dice_line_centerline_aux_v1
description: ABI-324 five-frame temporal C4 detail-consensus line-state U-Net with trusted random mirroring disabled to test whether preserving GOES scan/illumination orientation improves MIT-positive undercoverage and connected-line continuity.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch_plus_sza_temporal
output_form: mask_logits
auxiliary_targets:
  - name: line
    output: line_logits
    loss: weighted_bce
    weight: 0.01
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: temporal_eligible_center
  temporal_frame_offsets: [-2, -1, 0, 1, 2]
  augmentation_policy: none
training:
  loss: bce_dice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 2
  max_epochs: 12
  scheduler:
    policy: constant_lr

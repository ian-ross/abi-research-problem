name: abi046_fullspectral_deeplabv3plus_btd_mixer_v1
description: Full-spectral DeepLabV3+ continuation with normalized thermal BTD planes and learned channel mixer.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch
output_form: mask_logits
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: bce_dice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12

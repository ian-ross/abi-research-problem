name: abi133_fullspectral_btd_aspp_detail_decoder_sza_bce_dice_line_centerline_aux_v1
description: SZA-aware full-spectral BTD ASPP/detail decoder continuation adding trusted Line Target supervision alongside Centerline Target to recover connectivity while preserving ABI-130 recall calibration.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch_plus_sza
output_form: mask_logits
auxiliary_targets:
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
  - name: line
    output: line_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: bce_dice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

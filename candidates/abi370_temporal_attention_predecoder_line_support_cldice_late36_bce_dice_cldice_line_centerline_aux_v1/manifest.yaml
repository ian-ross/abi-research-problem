name: abi370_temporal_attention_predecoder_line_support_cldice_late36_bce_dice_cldice_line_centerline_aux_v1
description: Late-improving trusted-loss continuation of ABI-350 temporal-attention pre-decoder line-support U-Net using allowlisted BCE-Dice-clDice to test whether topology-aware supervision improves connected thin-line continuity without candidate-owned postprocessing.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch_plus_sza_temporal
output_form: mask_logits
auxiliary_targets:
  - name: line
    output: line_logits
    loss: weighted_bce
    weight: 0.01
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: temporal_eligible_center
  temporal_frame_offsets: [-1, 0, 1]
  augmentation_policy: random_mirroring
training:
  loss: bce_dice_cldice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 2
  max_epochs: 12
  scheduler:
    policy: constant_lr

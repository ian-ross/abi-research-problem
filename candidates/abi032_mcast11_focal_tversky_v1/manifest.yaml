name: abi032_mcast11_focal_tversky_v1
description: Controlled focal-Tversky loss continuation of the MCAST 1.1-lineage positive control.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch
output_form: mask_logits
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: none
training:
  loss: focal_tversky
  optimizer: adamw
  learning_rate: 0.001
  batch_size: 4
  max_epochs: 3

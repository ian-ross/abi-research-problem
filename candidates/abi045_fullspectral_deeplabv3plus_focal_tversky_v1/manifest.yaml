name: abi045_fullspectral_deeplabv3plus_focal_tversky_v1
description: Full-spectral DeepLabV3+ family-development continuation using trusted focal-Tversky loss.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch
output_form: mask_logits
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: focal_tversky
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12

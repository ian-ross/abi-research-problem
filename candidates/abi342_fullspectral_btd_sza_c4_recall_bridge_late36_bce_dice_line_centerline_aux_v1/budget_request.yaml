  positives, high precision, and best checkpoint selection at epoch 31 of the
  approved late-improving budget. That trajectory is evidence that C4
  steerable-line context benefits from more than the exploratory 12-epoch ceiling.
  ABI-342 is a close mechanism-changing continuation rather than an unrelated
  new family: it preserves the provider-approved ABI+SZA input, derived
  approved-channel BTD front end, source-balanced sampling, trusted random
  mirroring, BCE-Dice loss, trusted Line and Centerline auxiliary outputs,
  optimizer, scheduler, and batch size. It changes only the architecture-internal
  mask head by adding a bounded C4/Line-evidence-gated signed recall residual
  intended to recover fixed-threshold recall without broad negative-patch
  clutter. The result remains capped representative feasibility evidence unless
  a later trusted diagnostic is requested.

name: abi067_fullspectral_btd_frequency_gated_line_unet_cldice_centerline_aux_w001_v1
description: Full-spectral BTD frequency-gated line U-Net continuation lowering the trusted centerline auxiliary loss weight to 0.01 to test recall/calibration recovery while preserving false-positive suppression.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch
output_form: mask_logits
auxiliary_targets:
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.01
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: bce_dice_cldice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

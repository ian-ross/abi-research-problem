name: abi031_mcast11_positive_control_v1
description: Randomly initialized MCAST 1.1-lineage positive control for Candidate Execution.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch
output_form: mask_logits
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: none
training:
  loss: bce_dice
  optimizer: adamw
  learning_rate: 0.001
  batch_size: 4
  max_epochs: 3

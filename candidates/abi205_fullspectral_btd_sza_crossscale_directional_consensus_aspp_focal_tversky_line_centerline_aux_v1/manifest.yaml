name: abi205_fullspectral_btd_sza_crossscale_directional_consensus_aspp_focal_tversky_line_centerline_aux_v1
description: Controlled loss-policy continuation of the cross-scale directional-consensus ASPP decoder, keeping ABI-201/202 architecture and trusted Line/Centerline auxiliary supervision but using trusted focal-Tversky primary loss to probe recall/false-positive tradeoffs.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch_plus_sza
output_form: mask_logits
auxiliary_targets:
  - name: line
    output: line_logits
    loss: weighted_bce
    weight: 0.01
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: focal_tversky
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

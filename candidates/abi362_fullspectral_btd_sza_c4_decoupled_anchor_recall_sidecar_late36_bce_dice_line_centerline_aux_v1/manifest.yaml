name: abi362_fullspectral_btd_sza_c4_decoupled_anchor_recall_sidecar_late36_bce_dice_line_centerline_aux_v1
description: Full-spectral ABI+SZA C4 U-Net that decouples a compact orientation-line anchor logit from a gated recall sidecar, targeting ABI-353 positive-tail recall while reducing negative-patch clutter and preserving ABI-249 compact precision.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch_plus_sza
output_form: mask_logits
auxiliary_targets:
  - name: line
    output: line_logits
    loss: weighted_bce
    weight: 0.01
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  augmentation_policy: random_mirroring
training:
  loss: bce_dice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

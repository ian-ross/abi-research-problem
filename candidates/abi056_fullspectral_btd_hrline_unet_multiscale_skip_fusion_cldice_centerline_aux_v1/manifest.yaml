name: abi056_fullspectral_btd_hrline_unet_multiscale_skip_fusion_cldice_centerline_aux_v1
description: Full-spectral BTD high-resolution line U-Net continuation with multi-scale skip fusion, trusted BCE-Dice-clDice, and Centerline Target auxiliary head weight 0.02.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch
output_form: mask_logits
auxiliary_targets:
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: bce_dice_cldice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12

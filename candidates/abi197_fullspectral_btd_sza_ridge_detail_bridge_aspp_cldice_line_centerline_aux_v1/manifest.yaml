name: abi197_fullspectral_btd_sza_ridge_detail_bridge_aspp_cldice_line_centerline_aux_v1
description: Trusted BCE-Dice-clDice loss-policy probe of the ABI-196 ridge-detail bridge ASPP architecture with Line plus Centerline auxiliary supervision.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch_plus_sza
output_form: mask_logits
auxiliary_targets:
  - name: line
    output: line_logits
    loss: weighted_bce
    weight: 0.01
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: bce_dice_cldice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

name: abi119_fullspectral_btd_context_pyramid_agreement_unet_shape_repair_focal_tversky_centerline_aux_v1
description: Repair of ABI-118 full-spectral BTD context-pyramid agreement U-Net scout, fixing FPN decoder spatial alignment while preserving low-frequency scene context to calibrate local thin-line evidence under trusted focal-Tversky loss and Centerline Target supervision.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch
output_form: mask_logits
repair:
  original_proposal_id: abi118_fullspectral_btd_context_pyramid_agreement_unet_focal_tversky_centerline_aux_v1
  original_candidate_id: abi118_fullspectral_btd_context_pyramid_agreement_unet_focal_tversky_centerline_aux_v1
  motivating_run_id: run_20260831_024833_2d90b0
  failure_classification: candidate_bug
  preserves_original_hypothesis: true
  preserves_comparison_target: true
auxiliary_targets:
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: focal_tversky
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

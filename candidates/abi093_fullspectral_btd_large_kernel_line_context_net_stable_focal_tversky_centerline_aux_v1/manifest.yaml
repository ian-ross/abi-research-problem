name: abi093_fullspectral_btd_large_kernel_line_context_net_stable_focal_tversky_centerline_aux_v1
description: Stability repair of the full-spectral BTD large-kernel line-context network using residual-scaled line blocks and trusted focal-Tversky loss with Centerline Target auxiliary supervision.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch
output_form: mask_logits
auxiliary_targets:
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: focal_tversky
  optimizer: adamw
  learning_rate: 0.0001
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

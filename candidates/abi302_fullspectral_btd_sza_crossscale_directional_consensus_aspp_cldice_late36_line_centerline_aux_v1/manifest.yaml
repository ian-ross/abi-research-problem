name: abi302_fullspectral_btd_sza_crossscale_directional_consensus_aspp_cldice_late36_line_centerline_aux_v1
description: ABI-202 cross-scale directional-consensus ASPP architecture with trusted BCE-Dice-clDice primary loss to test whether provider-owned connectivity pressure improves thin-line continuity without candidate-owned losses or postprocessing.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch_plus_sza
output_form: mask_logits
auxiliary_targets:
  - name: line
    output: line_logits
    loss: weighted_bce
    weight: 0.01
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: bce_dice_cldice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

name: abi263_fullspectral_btd_sza_overlap_segformer_directional_line_state_decoder_bce_dice_line_centerline_aux_v1
description: SegFormer-family continuation after ABI-262 that keeps the compact overlap-attention encoder but adds an architecture-internal high-resolution directional line-state decoder to improve connectivity without candidate-owned postprocessing.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch_plus_sza
output_form: mask_logits
auxiliary_targets:
  - name: line
    output: line_logits
    loss: weighted_bce
    weight: 0.02
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.03
data:
  sampling_policy: combined_source_balanced
  augmentation_policy: random_mirroring
training:
  loss: bce_dice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

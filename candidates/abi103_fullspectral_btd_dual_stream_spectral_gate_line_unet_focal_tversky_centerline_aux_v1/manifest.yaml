name: abi103_fullspectral_btd_dual_stream_spectral_gate_line_unet_focal_tversky_centerline_aux_v1
description: Full-spectral BTD dual-stream spectral-gate line U-Net scout separating reflective, thermal, and BTD evidence before line-aware fusion under trusted focal-Tversky and centerline auxiliary supervision.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch
output_form: mask_logits
auxiliary_targets:
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: focal_tversky
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

name: abi224_temporal_fiveframe_attention_difference_unet_bce_dice_line_centerline_aux_v1
description: Five-frame temporal attention/difference U-Net scout consuming provider-owned -2/-1/0/+1/+2 ABI+SZA frames.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch_plus_sza_temporal
output_form: mask_logits
auxiliary_targets:
  - name: line
    output: line_logits
    loss: weighted_bce
    weight: 0.01
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: temporal_eligible_center
  temporal_frame_offsets: [-2, -1, 0, 1, 2]
  augmentation_policy: random_mirroring
training:
  loss: bce_dice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 2
  max_epochs: 12
  scheduler:
    policy: constant_lr

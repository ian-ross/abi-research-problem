name: abi080_fullspectral_btd_frequency_gated_line_unet_multiscale_logit_consensus_focal_tversky_v1
description: Full-spectral BTD frequency-gated line U-Net continuation adding a multi-scale logit-consensus mask head to recover precision and connectivity while retaining focal-Tversky recall.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch
output_form: mask_logits
auxiliary_targets:
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: focal_tversky
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

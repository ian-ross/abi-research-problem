name: abi340_overlap_segformer_lowcost_line_consensus_decoder_bce_dice_line_centerline_aux_v1
description: Low-cost overlap SegFormer continuation with a compact line-consensus logit head that tries to preserve ABI-262 recall/MIT strength while recovering connected thin-line evidence without ABI-263s heavy directional decoder.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch_plus_sza
output_form: mask_logits
auxiliary_targets:
  - name: line
    output: line_logits
    loss: weighted_bce
    weight: 0.01
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  augmentation_policy: random_mirroring
training:
  loss: bce_dice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

name: abi369_temporal_attention_predecoder_line_support_no_mirroring_late36_bce_dice_line_centerline_aux_v1
description: Controlled data-policy continuation of ABI-350 temporal-attention pre-decoder line-support U-Net that disables trusted random mirroring to test whether preserving physical GOES scan/illumination orientation improves connected-line continuity, MIT/source balance, or fixed-threshold recall without broadening clutter.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch_plus_sza_temporal
output_form: mask_logits
auxiliary_targets:
  - name: line
    output: line_logits
    loss: weighted_bce
    weight: 0.01
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: temporal_eligible_center
  temporal_frame_offsets: [-1, 0, 1]
  augmentation_policy: none
training:
  loss: bce_dice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 2
  max_epochs: 12
  scheduler:
    policy: constant_lr

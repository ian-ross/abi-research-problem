name: abi048_fullspectral_deeplabv3plus_btd_cldice_v1
description: Full-spectral DeepLabV3+ BTD-mixer continuation using trusted BCE-Dice-clDice continuity loss.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch
output_form: mask_logits
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: bce_dice_cldice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12

name: abi100_fullspectral_btd_frequency_gated_line_unet_detshuffle_cldice_centerline_aux_v1
description: Full-spectral BTD frequency-gated line U-Net data-policy continuation changing ABI-066 from combined source-balanced traversal to trusted deterministic shuffle while retaining BCE-Dice-clDice and centerline auxiliary supervision.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch
output_form: mask_logits
auxiliary_targets:
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: deterministic_shuffle
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: bce_dice_cldice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

name: abi262_fullspectral_btd_sza_overlap_segformer_line_decoder_bce_dice_line_centerline_aux_v1
description: Compact SegFormer-style overlap-attention encoder with full-spectral BTD+SZA features and a line-aware high-resolution decoder to scout a modern lightweight backbone outside the recent temporal and C4/Radon branches.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch_plus_sza
output_form: mask_logits
auxiliary_targets:
  - name: line
    output: line_logits
    loss: weighted_bce
    weight: 0.01
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  augmentation_policy: random_mirroring
training:
  loss: bce_dice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

name: abi206_fullspectral_btd_sza_crossscale_directional_consensus_aspp_boundary_bce_dice_line_centerline_aux_v1
description: Controlled auxiliary-policy continuation of ABI-202 adding a low-weight trusted Boundary Target head to the cross-scale directional-consensus ASPP decoder while retaining BCE-Dice plus Line and Centerline auxiliary supervision.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch_plus_sza
output_form: mask_logits
auxiliary_targets:
  - name: line
    output: line_logits
    loss: weighted_bce
    weight: 0.01
  - name: boundary
    output: boundary_logits
    loss: weighted_bce
    weight: 0.005
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: bce_dice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

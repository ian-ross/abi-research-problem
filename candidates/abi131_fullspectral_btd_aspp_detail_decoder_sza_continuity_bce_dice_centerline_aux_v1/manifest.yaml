name: abi131_fullspectral_btd_aspp_detail_decoder_sza_continuity_bce_dice_centerline_aux_v1
description: SZA-aware full-spectral BTD ASPP/detail decoder continuation adding a neutral multi-directional continuity bridge to recover connectivity and negative-patch discipline.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch_plus_sza
output_form: mask_logits
auxiliary_targets:
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: bce_dice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

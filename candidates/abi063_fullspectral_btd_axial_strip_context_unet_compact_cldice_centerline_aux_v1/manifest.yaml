name: abi063_fullspectral_btd_axial_strip_context_unet_compact_cldice_centerline_aux_v1
description: Repair of ABI-062 axial strip-context U-Net with compact base width to preserve the strip-context family-scout hypothesis within the 25M-parameter smoke ceiling.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch
output_form: mask_logits
auxiliary_targets:
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: bce_dice_cldice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

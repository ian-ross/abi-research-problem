name: abi288_temporal_attention_directional_context_cldice_line_centerline_aux_v1
description: Trusted-loss mechanism scout that reuses the resource-profiled ABI-238 temporal-attention directional-context architecture but switches the primary objective to provider-owned BCE-Dice-clDice to test whether training-time connectivity pressure can recover connected thin-line continuity without candidate-owned losses or postprocessing.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch_plus_sza_temporal
output_form: mask_logits
auxiliary_targets:
  - name: line
    output: line_logits
    loss: weighted_bce
    weight: 0.01
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: temporal_eligible_center
  temporal_frame_offsets: [-1, 0, 1]
  augmentation_policy: random_mirroring
training:
  loss: bce_dice_cldice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 2
  max_epochs: 12
  scheduler:
    policy: constant_lr

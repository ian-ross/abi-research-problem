name: abi317_fullspectral_btd_sza_directional_message_passing_aspp_unet_bce_dice_line_centerline_aux_v1
description: Full-spectral BTD+SZA ASPP/detail U-Net with architecture-internal directional message-passing continuity bridge for connected thin-line support without candidate-owned postprocessing.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch_plus_sza
output_form: mask_logits
auxiliary_targets:
  - name: line
    output: line_logits
    loss: weighted_bce
    weight: 0.01
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: bce_dice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

name: abi081_fullspectral_btd_frequency_gated_line_unet_no_aux_focal_tversky_v1
description: Full-spectral BTD frequency-gated line U-Net continuation removing the centerline auxiliary head while retaining trusted focal-Tversky primary loss.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch
output_form: mask_logits
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: focal_tversky
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

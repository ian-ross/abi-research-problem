name: abi169_fullspectral_btd_sza_fullscale_skip_aspp_detail_decoder_cldice_centerline_aux_v1
description: Full-spectral BTD+SZA full-scale skip ASPP/detail decoder continuation changing ABI-154 from trusted BCE-Dice to BCE-Dice-clDice while retaining Centerline Target auxiliary supervision.
research_problem: goes_abi_contrail_segmentation
input_mode: abi_16ch_plus_sza
output_form: mask_logits
auxiliary_targets:
  - name: centerline
    output: centerline_logits
    loss: weighted_bce
    weight: 0.02
data:
  sampling_policy: combined_source_balanced
  frame_selection_policy: all_target_frames
  augmentation_policy: random_mirroring
training:
  loss: bce_dice_cldice
  optimizer: adamw
  learning_rate: 0.0003
  batch_size: 4
  max_epochs: 12
  scheduler:
    policy: constant_lr

diagnostic_question: >-
  On the provider-owned temporal-eligible validation population for ABI-348's
  five-frame [-2, -1, 0, +1, +2] `abi_16ch_plus_sza_temporal` input, did the
  dual-state connectivity blend produce a genuinely useful compact/recall
  trade-off, or did it mostly select another low-connectivity high-precision
  temporal C4 state? ABI-348 selected epoch 36 with 0.4278 val/filtered_dice,
  MIT 0.4102, Google 0.4784, precision 0.4775, recall 0.3875, connectivity
  0.3009, and 443,691 filtered predicted-positive pixels. Compare positive-patch
  complete misses and under-coverage buckets, fragmentation and connected-line
  continuity buckets, negative-patch clutter, source-stratified medians and
  tails, raw-vs-filtered gaps, and threshold behavior around the trusted fixed
  0.5 threshold against ABI-324 balanced five-frame temporal C4/detail-consensus
  comparator, ABI-337 no-mirroring control, ABI-344/325 broad recall-sidecar
  diagnostics, ABI-306 compact high-precision temporal C4 comparator, and ABI-223
  temporal-attention connectivity comparator.
expected_decision_impact: >-
  Use the Harness-owned temporal-eligible failure-bucket review to decide whether
  ABI-348 should become a useful five-frame temporal C4 compact/high-precision
  comparator and whether its dual-state blending mechanism is worth developing,
  or whether ABI-324/337 should remain the preferred five-frame comparators and
  this exact final-head branch should stop. If diagnostics show fewer complete
  positive misses, better low-recall positive tails, reduced negative-patch
  clutter, or improved MIT/source balance at ABI-324-like compactness without
  severe fragmentation, Artifact Filter dependence, or threshold fragility, a
  future mechanism-changing continuation may keep dual anchor/recall states while
  adding stronger connected-line support. If the apparent gain is mainly a
  compact high-precision footprint with ABI-344-like connectivity weakness,
  source-specific tail failures, threshold instability, or fragmented line
  continuity, treat ABI-348 as mixed/negative evidence for this blend head and
  broaden away from unchanged late36 temporal C4 final-head continuations. Treat
  the result as temporal-eligible diagnostic evidence only; it is not
  whole-validation promotion evidence and it must not authorize Candidate-owned
  data loading, temporal lookup, sample selection, losses, metrics, Artifact
  Filters, thresholding, postprocessing, coordinates, augmentation implementation,
  or resource scheduling.

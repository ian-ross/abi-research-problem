diagnostic_question: >-
  On the provider-owned temporal-eligible validation population for ABI-344's
  five-frame [-2, -1, 0, +1, +2] `abi_16ch_plus_sza_temporal` input, did the
  explicit connectivity-anchor plus agreement-gated recall sidecar preserve the
  balanced ABI-324/337 compactness while recovering useful true-contrail recall,
  or did it repeat the temporal C4 family's oscillation between broad recall and
  connected compact states? ABI-344 selected epoch 29 with 0.4264
  val/filtered_dice, MIT 0.4122, Google 0.4626, precision 0.4267, recall
  0.4262, connectivity 0.3157, and 546,166 filtered predicted-positive pixels.
  Compared with ABI-324 balanced detail-consensus comparator (0.4294 filtered
  Dice, 0.3950 recall, 0.3979 connectivity, 459,172 filtered predicted-positive
  pixels), ABI-337 no-mirroring control, ABI-341 recall-router diagnostic,
  ABI-325 positive-tail recall diagnostic, and ABI-223 temporal-attention
  connectivity comparator, review positive-patch complete misses and
  under-coverage buckets, fragmentation and connected-line continuity buckets,
  negative-patch clutter, source-stratified medians and tails, raw-vs-filtered
  gaps, and threshold behavior around the trusted fixed 0.5 threshold.
expected_decision_impact: >-
  Use the Harness-owned temporal-eligible failure-bucket review to decide whether
  ABI-344's apparent recall/source gain is actionable evidence for a future
  temporal C4 anchor-sidecar mechanism, or whether the branch should stop as
  another broad-footprint recall variant with weak connectivity. If diagnostics
  show fewer complete positive misses, better low-recall positive tails, and MIT
  improvement without ABI-341-like negative-patch clutter, Artifact Filter
  dependence, source imbalance, threshold fragility, or fragmented line
  continuity, future work may keep the separated compact-anchor/recall-sidecar
  idea while adding stronger connectivity or precision constraints. If the gain
  is mostly larger footprint, negative-patch clutter, fragmentation,
  checkpoint/threshold instability, or a Google/source trade-off, keep ABI-324 as
  the balanced five-frame temporal C4 comparator, treat ABI-344 as mixed/negative
  evidence for this sidecar head, and broaden away from unchanged late36 temporal
  C4 residual-head continuations. Treat the result as temporal-eligible
  diagnostic evidence only; it is not whole-validation promotion evidence and it
  must not authorize Candidate-owned data loading, temporal lookup, sample
  selection, losses, metrics, Artifact Filters, thresholding, postprocessing,
  coordinates, augmentation implementation, or resource scheduling.
